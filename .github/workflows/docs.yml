name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CL.Common/**'
      - 'CL.GitHelper/**'
      - 'CL.Imaging/**'
      - 'CL.Mail/**'
      - 'CL.Data/**'
      - 'CL.Data.*/**'
      - 'CL.MSSQL/**'
      - 'CL.NetUtils/**'
      - 'CL.PostgreSQL/**'
      - 'CL.SocialConnect/**'
      - 'CL.Storage/**'
      - 'CL.SystemStats/**'
      - 'CL.TwoFactorAuth/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout CodeLogic.Libs
        uses: actions/checkout@v7

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Clone CodeLogic framework (dependency)
        shell: bash
        run: |
          # CL.* projects reference ../../CodeLogic/src/CodeLogic.csproj
          # Working dir is D:\a\<repo>\<repo>\ on Windows runners
          # So we need to clone to D:\a\<repo>\CodeLogic\
          TARGET="$(dirname "$(pwd)")/CodeLogic"
          git clone --depth 1 https://github.com/zyntal-com/CodeLogic.git "$TARGET"
          echo "Cloned to: $TARGET"
          ls "$TARGET/src/"

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build all projects (generates XML docs)
        shell: bash
        run: |
          for proj in CL.Common CL.GameNetQuery CL.GitHelper CL.Data CL.Data.MySql CL.Data.Sqlite CL.Imaging CL.Mail CL.MSSQL CL.NetUtils CL.PostgreSQL CL.SocialConnect CL.Storage CL.SystemStats CL.TwoFactorAuth; do
            dotnet build $proj/$proj.csproj --configuration Release
          done

      - name: Build documentation
        run: docfx docs/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
