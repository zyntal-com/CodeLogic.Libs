name: Build And Release

on:
  push:
    branches:
      - 'release/**'
      - 'prerelease/**'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all libraries (ignore change detection)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: codelogic-libs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Publishing to nuget.org cannot be undone - a version can be delisted but never
  # replaced or reused. Nothing is packed until the full suite is green.
  # Creating a release/* or prerelease/* branch (Promote does this the first time) must not publish:
  # publishing happens through Promote's dispatch or a push of new commits.
  verify:
    if: github.event_name != 'push' || !github.event.created
    uses: ./.github/workflows/ci-tests.yml

  release:
    needs: [verify]
    if: github.event_name != 'push' || !github.event.created
    runs-on: ubuntu-latest
    # Must match the nuget.org Trusted Publishing policy (workflow release.yml, environment production).
    environment: production
    permissions:
      contents: write
      id-token: write   # OIDC token exchanged for a short-lived nuget.org API key

    steps:
      - name: Checkout CodeLogic.Libs
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Detect changes and compute version
        id: changes
        shell: pwsh
        run: |
          $allProjects = @(
            'CL.Common', 'CL.GameNetQuery', 'CL.GitHelper', 'CL.Mail',
            'CL.MySQL2', 'CL.MSSQL', 'CL.NetUtils', 'CL.PostgreSQL', 'CL.SQLite',
            'CL.SocialConnect', 'CL.Storage', 'CL.SystemStats', 'CL.TwoFactorAuth',
            'CL.Data', 'CL.Data.MySql', 'CL.Data.PostgreSql', 'CL.Data.SqlServer', 'CL.Data.Sqlite'
          )

          # Packages released together: a change to any member packs every member, so a provider
          # never points at a CodeLogic.Data version that was not published.
          $packageGroups = @(
            ,@('CL.Data', 'CL.Data.MySql', 'CL.Data.PostgreSql', 'CL.Data.SqlServer', 'CL.Data.Sqlite')
          )

          $buildAll = '${{ github.event.inputs.build_all }}' -eq 'true'

          # Find the last release tag of THIS line (libs-v<major.minor>-<run>), so a 4.x release
          # never diffs against a 5.x tag.
          $line = (Get-Content 'version.txt' -TotalCount 1).Trim()
          $tagPattern = if ('${{ github.ref_name }}'.StartsWith('prerelease/')) { "libs-preview-v$line-*" } else { "libs-v$line-*" }
          "line=$line" >> $env:GITHUB_OUTPUT
          $lastTag = git describe --tags --abbrev=0 --match $tagPattern 2>$null

          if ($buildAll -or -not $lastTag) {
            Write-Host "Building all libraries (build_all=$buildAll, lastTag=$lastTag)"
            $changedProjects = $allProjects
          } else {
            $changedFiles = git diff --name-only "$lastTag..HEAD" 2>$null
            if (-not $changedFiles) { $changedFiles = @() }

            # If version.txt changed, rebuild all — the major.minor line moved.
            $versionFileChanged = $changedFiles | Where-Object { $_ -eq 'version.txt' }
            if ($versionFileChanged) {
              Write-Host "version.txt changed — rebuilding all libraries"
              $changedProjects = $allProjects
            } else {
              # A lib counts as "changed" if any file under its folder changed since
              # the last tag. csproj is no longer auto-bumped/committed, so there is
              # no self-cascade to exclude.
              $changedProjects = @()
              foreach ($project in $allProjects) {
                $hasRealChange = $changedFiles | Where-Object { $_ -like "$project/*" }
                if ($hasRealChange) { $changedProjects += $project }
              }

              if ($changedProjects.Count -eq 0) {
                Write-Host "No library changes since $lastTag — nothing to release"
                "has_changes=False" >> $env:GITHUB_OUTPUT
                "projects=" >> $env:GITHUB_OUTPUT
                exit 0
              }
            }
          }

          # Expand package groups, then add every CL.* library a packed library references
          # (ProjectReference to ../CL.X/CL.X.csproj). Its nuspec dependency becomes this run's
          # version, so that version has to be published too.
          foreach ($group in $packageGroups) {
            if ($changedProjects | Where-Object { $group -contains $_ }) {
              foreach ($member in $group) { if ($changedProjects -notcontains $member) { $changedProjects += $member } }
            }
          }
          function Get-ClReferences([string]$project) {
            $csproj = Join-Path $project "$project.csproj"
            if (-not (Test-Path $csproj)) { return @() }
            [xml]$xml = Get-Content $csproj
            @($xml.SelectNodes('//ProjectReference') | ForEach-Object { $_.Include } |
              ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) } |
              Where-Object { $allProjects -contains $_ })
          }
          do {
            $added = $false
            foreach ($project in @($changedProjects)) {
              foreach ($ref in Get-ClReferences $project) {
                if ($changedProjects -notcontains $ref) { $changedProjects += $ref; $added = $true }
              }
            }
          } while ($added)

          # Pack (and later push) referenced libraries before the libraries that depend on them.
          $ordered = New-Object System.Collections.Generic.List[string]
          function Add-InOrder([string]$project) {
            if ($ordered.Contains($project)) { return }
            foreach ($ref in Get-ClReferences $project) { if ($changedProjects -contains $ref) { Add-InOrder $ref } }
            $ordered.Add($project)
          }
          foreach ($project in $changedProjects) { Add-InOrder $project }
          $changedProjects = @($ordered)

          Write-Host "Changed projects: $($changedProjects -join ', ')"

          # ── Composed version: {major.minor from version.txt}.{run_number}[+sha] ──
          # Major.Minor is hand-controlled in version.txt. The GitHub run number is the
          # monotonic, NuGet-orderable patch (always higher each run). The short SHA is
          # SemVer build-metadata: nuget.org strips it from the package version, so it is
          # provenance only — it survives in the assembly InformationalVersion. Nothing is
          # written back to the repo; the version is composed at pack time via -p:Version.
          $rootVer = (Get-Content 'version.txt' -TotalCount 1).Trim()   # e.g. "4.8"
          $sha     = '${{ github.sha }}'.Substring(0, 7)
          if ('${{ github.ref_name }}'.StartsWith('prerelease/')) {
            $version = "$rootVer.${{ github.run_number }}-preview+$sha"
          } else {
            $version = "$rootVer.${{ github.run_number }}+$sha"
          }

          Write-Host "Composed version for this run: $version (all packed libs share it)"

          $projectList = $changedProjects -join ','
          "projects=$projectList" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "has_changes=$($changedProjects.Count -gt 0)" >> $env:GITHUB_OUTPUT

      - name: Restore and pack changed libraries
        if: steps.changes.outputs.has_changes == 'True'
        shell: pwsh
        run: |
          $projects = "${{ steps.changes.outputs.projects }}".Split(',')
          $version  = "${{ steps.changes.outputs.version }}"
          $line     = "${{ steps.changes.outputs.line }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $versionLines = New-Object System.Collections.Generic.List[string]
          $packageIds = @()

          foreach ($project in $projects) {
            $csproj = Join-Path $project "$project.csproj"

            $versionLines.Add("$project=$version")
            [xml]$projXml = Get-Content $csproj
            $packageId = ($projXml.SelectNodes('//PackageId') | Select-Object -First 1).InnerText
            if (-not $packageId) { $packageId = $project }
            $packageIds += $packageId

            dotnet restore $csproj /p:CodeLogicFromNuGet=true
            dotnet pack $csproj --configuration Release --no-restore --output artifacts `
              /p:PackageVersion=$version /p:Version=$version /p:InformationalVersion=$version `
              /p:CodeLogicFromNuGet=true
          }

          $versionLines | Set-Content 'artifacts/package-versions.txt'
          # Push order: referenced packages first (see "Detect changes").
          $packageIds | ForEach-Object { "$_.$($version.Split('+')[0]).nupkg" } | Set-Content 'artifacts/push-order.txt'

          # NuGet normalizes PackageReference ranges to use the restored version as
          # the lower bound. For libs to keep accepting older CodeLogic versions,
          # rewrite each nupkg's .nuspec to use the literal range "[5.0.0-0, 6.0.0)".
          # 5.0 is the floor: the libraries use the net11 union Result/Error API; "-0" admits 5.0 previews.
          $targetRange = '[5.0.0-0, 6.0.0)'
          foreach ($nupkg in Get-ChildItem artifacts -Filter '*.nupkg') {
            $tmp = "$env:RUNNER_TEMP/nupkg-$([Guid]::NewGuid())"
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            Expand-Archive $nupkg.FullName -DestinationPath $tmp -Force
            $nuspec = Get-ChildItem $tmp -Filter '*.nuspec' | Select-Object -First 1
            if (-not $nuspec) { Remove-Item $tmp -Recurse -Force; continue }
            [xml]$doc = Get-Content $nuspec.FullName
            $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
            $ns.AddNamespace('n', $doc.DocumentElement.NamespaceURI)
            $changed = $false
            foreach ($d in $doc.SelectNodes('//n:dependency[@id="CodeLogic"]', $ns)) { $d.version = $targetRange; $changed = $true }
            # Dependencies on packages built in this run (CodeLogic.Data from a provider, CodeLogic.Common
            # from CodeLogic.Data): at least this run's version, below the next major.
            $siblingRange = "[$($version.Split('+')[0]), $([int]$line.Split('.')[0] + 1).0.0)"
            foreach ($d in $doc.SelectNodes('//n:dependency', $ns)) {
              if ($packageIds -contains $d.id) { $d.version = $siblingRange; $changed = $true }
            }
            if ($changed) {
              $doc.Save($nuspec.FullName)
              # Repack — zip contents (nuspec must be at root)
              Remove-Item $nupkg.FullName
              Compress-Archive -Path "$tmp/*" -DestinationPath $nupkg.FullName
              Write-Host "Rewrote CodeLogic → $targetRange and sibling → $siblingRange dependencies in $($nupkg.Name)"
            }
            Remove-Item $tmp -Recurse -Force
          }

          $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm UTC'
          @"
          ## CodeLogic.Libs release

          **Commit**: ${{ github.sha }}
          **Time**: $timestamp

          ### Package versions
          $($versionLines | ForEach-Object { "- $_" } | Out-String)
          "@ | Set-Content 'artifacts/release-notes.md'

      # Release 4.8.86 shipped five of fourteen packages and then died on the sixth:
      # CL.MySQL2 had grown release notes past nuget.org's 35 000 character cap and was
      # rejected with a 400 mid-loop. The five already up could not be withdrawn.
      # Validate every package BEFORE pushing any of them.
      - name: Pre-flight packages
        if: steps.changes.outputs.has_changes == 'True'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          count=0
          for pkg in artifacts/*.nupkg; do
            count=$((count + 1))
            nuspec=$(unzip -p "$pkg" '*.nuspec' | tr -d '\n')
            notes=$(printf '%s' "$nuspec" | sed -n 's|.*<releaseNotes>\(.*\)</releaseNotes>.*|\1|p' | wc -c)
            if [ "$notes" -gt 35000 ]; then
              echo "::error::$(basename "$pkg"): releaseNotes is $notes chars, nuget.org caps at 35000"
              fail=1
            fi
            if ! printf '%s' "$nuspec" | grep -q '<id>'; then
              echo "::error::$(basename "$pkg"): nuspec has no <id>"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to publish - a partial push cannot be undone"
            exit 1
          fi
          echo "pre-flight OK: $count package(s)"

      # Trusted Publishing: no long-lived API key. The temporary key is valid for ~1 hour.
      - name: NuGet login (OIDC)
        if: steps.changes.outputs.has_changes == 'True'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: steps.changes.outputs.has_changes == 'True'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # Referenced packages go up before the packages that depend on them (push-order.txt).
          # push-order.txt is written by PowerShell (CRLF on Windows runners), so strip CRs.
          tr -d '\r' < artifacts/push-order.txt | while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            dotnet nuget push "artifacts/$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub release
        if: steps.changes.outputs.has_changes == 'True'
        uses: softprops/action-gh-release@v3
        with:
          # Tag the commit that was built. Without this a new tag lands on the default branch.
          target_commitish: ${{ github.sha }}
          tag_name: ${{ startsWith(github.ref_name, 'prerelease/') && format('libs-preview-v{0}-{1}', steps.changes.outputs.line, github.run_number) || format('libs-v{0}-{1}', steps.changes.outputs.line, github.run_number) }}
          name: ${{ startsWith(github.ref_name, 'prerelease/') && format('CodeLogic.Libs {0} preview {1}', steps.changes.outputs.line, github.run_number) || format('CodeLogic.Libs {0} release {1}', steps.changes.outputs.line, github.run_number) }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'prerelease/') }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/package-versions.txt

      # NOTE: this workflow no longer writes versions back to the repo.
      # The package version is composed at pack time as
      #   {major.minor from version.txt}.{github.run_number}[+short-sha]
      # via -p:Version=, so no csproj is edited and nothing is committed.
      # main and release therefore never diverge by a version-bump commit.
      #
      # Workflow:
      #   - dev pushes feature work to main (no version churn anywhere)
      #   - bump major/minor by editing version.txt when desired
      #   - to publish: run Promote (source main or support/<N>.x, channel prerelease|release),
      #     which merges into <channel>/<N>.x and dispatches this workflow
      #   - this workflow fires, packs with the composed version, publishes
      #     to NuGet, and creates a GitHub release
      #
      # The git short-sha rides in SemVer build-metadata: nuget.org strips it
      # from the package version (provenance only), and it survives in each
      # assembly's InformationalVersion.
