name: CI Tests

# The test matrix, callable from both the PR/push workflow and the release gate so the
# two can never drift apart. Publishing to nuget.org is irreversible, so the release
# must run exactly the checks a pull request runs - not a copy of them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The libraries reference CodeLogic from NuGet (CodeLogicFromNuGet=true), and the
      # test projects reference the libraries by ProjectReference — so no sibling
      # CodeLogic source clone is needed here.
      #
      # Live-service tests (SMTP, S3, Steam, Postgres, DNSBL/GeoIP, git remote, and the
      # CL.Data provider suites) self-skip when their connection/env vars are absent, so this job
      # runs the full offline suite with no external infrastructure or secrets.
      - name: Run tests
        shell: bash
        run: |
          set -e
          fail=0
          for proj in tests/*/*.Tests.csproj; do
            echo "::group::dotnet test $proj"
            dotnet test "$proj" \
              --configuration Release \
              -p:CodeLogicFromNuGet=true \
              --logger "console;verbosity=normal" \
              || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # CL.Data live conformance suites. Each provider test project derives from tests/Data.Conformance and
  # self-skips without its CL_DATA_*_CS connection string; SQLite runs in-process in the `test` job above.
  data-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cl_data
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CL_DATA_MYSQL_CS: Server=127.0.0.1;Port=3306;Database=cl_data;User ID=root;Password=;AllowUserVariables=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Enable local_infile (native bulk copy)
        run: docker exec $(docker ps -q --filter ancestor=mysql:8.4) mysql -uroot -e "SET GLOBAL local_infile = 1"

      - name: Run CL.Data MySQL tests
        run: dotnet test tests/Data.MySql.Tests/Data.MySql.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  data-replicas:
    # Live primary/replica pairs (MySQL GTID, PostgreSQL streaming). Not required: replica startup is the most fragile part of CI.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      CL_DATA_REPLICAS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start replica pairs
        run: |
          docker compose -f tests/replicas/docker-compose.yml up -d --wait mysql-primary pg-primary
          docker compose -f tests/replicas/docker-compose.yml up -d mysql-replica pg-replica
          for i in $(seq 1 90); do
            docker compose -f tests/replicas/docker-compose.yml exec -T mysql-replica mysql -uroot -e "SHOW REPLICA STATUS\G" 2>/dev/null | grep -q "Replica_SQL_Running: Yes"               && docker compose -f tests/replicas/docker-compose.yml exec -T pg-replica psql -U postgres -d cl_data -tAc "SELECT pg_is_in_recovery()" 2>/dev/null | grep -q t               && exit 0
            sleep 2
          done
          docker compose -f tests/replicas/docker-compose.yml logs
          exit 1

      - name: Run live replica tests
        run: |
          dotnet test tests/Data.MySql.Tests/Data.MySql.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --filter "FullyQualifiedName~LiveReplica" --logger "console;verbosity=normal"
          dotnet test tests/Data.PostgreSql.Tests/Data.PostgreSql.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --filter "FullyQualifiedName~LiveReplica" --logger "console;verbosity=normal"

  data-perf:
    # Performance budgets (benchmarks/budgets.json): allocations per operation and time relative to Dapper/ADO.NET.
    # Not required yet: shared CI runners are noisy; allocations are the reliable signal.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cl_data
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CL_DATA_MYSQL_CS: Server=127.0.0.1;Port=3306;Database=cl_data;User ID=root;Password=;AllowLoadLocalInfile=true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Enable local_infile (bulk copy)
        run: docker exec $(docker ps -q --filter ancestor=mysql:8.4) mysql -uroot -e "SET GLOBAL local_infile = 1"

      - name: Check performance budgets
        run: dotnet run -c Release --project benchmarks/Data.Benchmarks -p:CodeLogicFromNuGet=true -- --check-budgets benchmarks/budgets.json

  data-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: cl_data_pw
          POSTGRES_DB: cl_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CL_DATA_PG_CS: Host=127.0.0.1;Port=5432;Database=cl_data;Username=postgres;Password=cl_data_pw
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run CL.Data PostgreSQL tests
        run: dotnet test tests/Data.PostgreSql.Tests/Data.PostgreSql.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  data-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MSSQL_SA_PASSWORD: Your_strong_password123!
      CL_DATA_MSSQL_CS: Server=127.0.0.1,1433;Database=cl_data;User ID=sa;Password=Your_strong_password123!;Encrypt=False;TrustServerCertificate=True
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start SQL Server 2019
        shell: bash
        run: |
          docker run --name cl-data-mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" -p 1433:1433 -d mcr.microsoft.com/mssql/server:2019-latest
          for i in {1..60}; do
            if docker exec cl-data-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec cl-data-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(N'cl_data') IS NULL CREATE DATABASE [cl_data]"

      - name: Run CL.Data SQL Server tests
        run: dotnet test tests/Data.SqlServer.Tests/Data.SqlServer.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

  # The Linux job below proves TLS against OpenSSL; Windows classifies TLS failures through SChannel and keeps
  # a client certificate's key in a temporary key container, and neither ran in CI while every live test
  # skipped on the windows job above. GitHub's Windows runners cannot start the Linux containers, so this job
  # runs the mutual-TLS tests against rclone's WebDAV server with the same requirements as the webdav-mtls
  # container: TLS 1.3 only and a client certificate issued by fixtures/mtls/client-ca.crt.
  # Native AOT: publish the CL.Data smoke app (CRUD on SQLite through generated accessors) and run it.
  # The publish must not warn about CL.Data, CL.Common or CodeLogic; the app must exit 0.
  data-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish (Native AOT)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish samples/Data.AotSmoke -c Release -p:CodeLogicFromNuGet=true -o aot-out 2>&1 | tee publish.log
          # Strip the project path ("[.../CodeLogic.Libs/...]") before looking for our own code in warnings.
          if grep -E "warning (IL|AOT)" publish.log | sed 's/ \[.*//' | grep -E "CL\.Data|CL\.Common|CodeLogic\."; then
            echo "::error::Trim/AOT warnings from CL.Data, CL.Common or CodeLogic"; exit 1
          fi
      - name: Run
        run: ./aot-out/Data.AotSmoke

  storage-windows-tls:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CL_STORAGE_TEST_WEBDAV_URL: https://localhost:8444/
      CL_STORAGE_TEST_WEBDAV_MTLS_URL: https://localhost:8444/
      CL_STORAGE_TEST_WEBDAV_USER: cltest
      CL_STORAGE_TEST_WEBDAV_PASS: cltest-pw
      # Not named RCLONE_*: rclone reads every RCLONE_<NAME> variable as its --<name> flag.
      WEBDAV_SERVER_RCLONE: v1.75.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # One step, so the server started in the background lives exactly as long as the tests need it.
      - name: Run mutual-TLS tests on Windows (SChannel) against a mutual-TLS WebDAV server
        shell: bash
        run: |
          set -e
          curl -sSLo rclone.zip "https://downloads.rclone.org/$WEBDAV_SERVER_RCLONE/rclone-$WEBDAV_SERVER_RCLONE-windows-amd64.zip"
          unzip -q rclone.zip
          mkdir -p "$RUNNER_TEMP/dav"
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" -keyout "$RUNNER_TEMP/srv.key" -out "$RUNNER_TEMP/srv.crt"
          "./rclone-$WEBDAV_SERVER_RCLONE-windows-amd64/rclone.exe" serve webdav "$RUNNER_TEMP/dav" --addr localhost:8444 \
            --cert "$RUNNER_TEMP/srv.crt" --key "$RUNNER_TEMP/srv.key" \
            --client-ca tests/Storage.Integration.Tests/fixtures/mtls/client-ca.crt --min-tls-version tls1.3 \
            --user cltest --pass cltest-pw > "$RUNNER_TEMP/rclone.log" 2>&1 &
          up=0
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/8444) >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then cat "$RUNNER_TEMP/rclone.log"; exit 1; fi
          dotnet test tests/Storage.Integration.Tests/Storage.Integration.Tests.csproj --configuration Release \
            -p:CodeLogicFromNuGet=true --filter "FullyQualifiedName~MutualTlsLiveTests" --logger "console;verbosity=normal"

  # Live FTP, SFTP and WebDAV servers plus MinIO, Azurite, fake-gcs-server and Swift SAIO for
  # CL.Storage, so every provider runs against a real protocol without a cloud account. The same compose file is used for local
  # runs, so CI and a developer machine exercise identical servers. Without the CL_STORAGE_TEST_*
  # variables the suite self-skips, which is what the windows test job above sees (storage-windows-tls runs the mutual-TLS tests there).
  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CL_STORAGE_TEST_SFTP_HOST: 127.0.0.1
      CL_STORAGE_TEST_SFTP_PORT: '2022'
      CL_STORAGE_TEST_SFTP_USER: cltest
      CL_STORAGE_TEST_SFTP_PASS: cltest-pw
      CL_STORAGE_TEST_FTP_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTP_PORT: '2021'
      CL_STORAGE_TEST_FTP_USER: cltest
      CL_STORAGE_TEST_FTP_PASS: cltest-pw
      CL_STORAGE_TEST_FTP_ROOT: home/cltest
      CL_STORAGE_TEST_WEBDAV_URL: http://127.0.0.1:8080/
      CL_STORAGE_TEST_WEBDAV_USER: cltest
      CL_STORAGE_TEST_WEBDAV_PASS: cltest-pw
      CL_STORAGE_TEST_S3_URL: http://127.0.0.1:9010
      CL_STORAGE_TEST_S3_ACCESSKEY: cltest
      CL_STORAGE_TEST_S3_SECRETKEY: cltest-pw-minio
      CL_STORAGE_TEST_AZURE_CONNECTION_STRING: UseDevelopmentStorage=true
      CL_STORAGE_TEST_GCS_URL: http://127.0.0.1:4443
      CL_STORAGE_TEST_SWIFT_AUTH_URL: http://127.0.0.1:8082/auth/v1.0
      CL_STORAGE_TEST_SWIFT_USER: test:tester
      CL_STORAGE_TEST_SWIFT_KEY: testing
      CL_STORAGE_TEST_PROXY_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTPS_HOST: 127.0.0.1
      CL_STORAGE_TEST_FTPS_PORT: '2024'
      CL_STORAGE_TEST_FTPS_USER: cltest
      CL_STORAGE_TEST_FTPS_PASS: cltest-pw
      CL_STORAGE_TEST_WEBDAV_DIGEST_URL: http://127.0.0.1:8081/
      CL_STORAGE_TEST_WEBDAV_TLS_URL: https://localhost:8443/
      CL_STORAGE_TEST_WEBDAV_MTLS_URL: https://localhost:8444/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK version comes from global.json (11.0 line; prerelease allowed until GA).
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start storage servers and emulators
        shell: bash
        run: |
          docker compose -f tests/Storage.Integration.Tests/docker-compose.yml up -d --build
          for port in 2021 2022 2023 2024 8080 8081 8443 8444 9010 10000 4443 8082 3128 1080; do
            for i in {1..120}; do
              if (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then break; fi
              sleep 1
            done
          done
          # A published port accepts connections even when the server behind it has died, so wait
          # for the FTP greeting too (the FTP containers restart themselves if vsftpd dies at startup).
          for port in 2021 2024; do
            for i in {1..60}; do
              if timeout 3 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 3 <&3" 2>/dev/null | grep -q 220; then break; fi
              sleep 1
            done
          done

      # The windows job above runs the unit suite too; running it here covers Linux-only paths such
      # as Unix permission bits and local symbolic links, which Windows cannot create without admin.
      - name: Run storage unit tests on Linux
        run: dotnet test tests/Storage.Tests/Storage.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

      - name: Run storage integration tests
        run: dotnet test tests/Storage.Integration.Tests/Storage.Integration.Tests.csproj --configuration Release -p:CodeLogicFromNuGet=true --logger "console;verbosity=normal"

      - name: Server logs on failure
        if: failure()
        run: docker compose -f tests/Storage.Integration.Tests/docker-compose.yml logs
